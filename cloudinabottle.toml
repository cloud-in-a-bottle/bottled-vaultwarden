[app]
name = "vaultwarden"
version = "0.1.0"
description = """
Vaultwarden (self-hosted Bitwarden-compatible password manager) for Cloud in a Bottle.

zone_auth keeps Vaultwarden access private to the owner, but they must also set a MASTER PASSWORD inside Vaultwarden to encrypt their passwords. There's also a separate credential for /admin, which is printed in the logs. Both of these are by design, and required for any good password manager."""
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
# OpenHost-routed port.  The auth-proxy sidecar listens here,
# strips client-supplied X-OpenHost-* / X-Remote-User headers
# (defence in depth), and forwards everything to vaultwarden's
# Rocket server on 127.0.0.1:8088.  /_healthz is synthesised
# locally as a static 200 OK.
port = 8080

[routing]
# /_healthz is served by the auth-proxy; the OpenHost router uses
# this for its container health probe.
health_check = "/_healthz"
# The Bitwarden API paths must be public so native clients (browser
# extension, mobile app, desktop) can reach them.  Those clients carry
# Bitwarden auth tokens, not OpenHost session cookies, so zone_auth
# cannot gate them — their POST requests would be redirected by
# zone_auth and the client would follow as GET, breaking the login
# flow.  Vault data is safe regardless: it is end-to-end encrypted
# and Bitwarden enforces its own authentication on every API call.
# The web vault UI at / remains zone_auth-gated (owner-only).
public_paths = [
    "/_healthz",
    "/api/",
    "/identity/",
    "/notifications/",
    "/icons/",
]

# Surface Vaultwarden's server-admin panel on the app's detail page.
# /admin is owner-gated by the router (it is not a public_path); the
# operator enters the admin token (printed to the container logs on
# first boot) to access it.
[[links]]
name = "Admin panel"
path = "/admin"

[resources]
memory_mb = 512
cpu_cores = 0.5

[data]
# Persistent state under /data/app_data/vaultwarden/:
#   * db.sqlite3                — vaults, users, attachments metadata.
#   * attachments/, sends/, ... — file attachments.
#   * rsa_key.pem, rsa_key.pub  — Vaultwarden's JWT signing key.
#   * admin_token.txt           — the /admin panel access token,
#                                 generated on first boot and shown
#                                 to the operator.  NOT a user
#                                 credential — it only protects the
#                                 server-admin diagnostic panel.
app_data = true
app_temp_data = false
